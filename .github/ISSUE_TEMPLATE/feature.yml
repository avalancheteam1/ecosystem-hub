name: Feature or change
description: Propose something new or a change - ideally before you write code.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who needs this and why? What is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change? Mention new dependencies, database changes or external services if you expect any.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched existing issues and nobody is working on this yet
          required: true
        - label: I'd like to build this myself
