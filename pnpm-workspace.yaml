minimumReleaseAge: 1440 # minutes (1 day) - delay installing freshly published versions

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

# mysql2 is only an optional peer of better-auth (we use Postgres and never load
# it), but pin it past known advisories so `pnpm audit` stays clean.
overrides:
  mysql2: '>=3.23.1'
  # effect comes only via @prisma/config (pins 3.20.0, CLI-time config parsing); past GHSA-7589-6fvf-x4pw. Drop once Prisma bumps it.
  effect: '^3.22.1'
