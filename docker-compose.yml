# Local development database only. The app and worker run on the host (pnpm dev / pnpm worker).
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: hub
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: hub
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - hub-pg:/var/lib/postgresql

volumes:
  hub-pg:
